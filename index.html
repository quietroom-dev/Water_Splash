<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Real Water Glass</title><link rel="stylesheet" href="style.css"></head><body><main id="app"><img id="background" src="background.png" alt=""><canvas id="waterGL"></canvas><canvas id="spray"></canvas><header class="ui"><label class="pill">背景を変更<input id="file" type="file" accept="image/*" hidden></label><button id="reset" class="pill">水を消す</button></header><section class="controls ui"><div class="row"><b>水量</b><span id="amountText">70%</span></div><input id="amount" type="range" min="5" max="100" value="70"><small>画面をタップすると、奥から水がかかります</small></section></main><script src="app.js"></script></body></html>
